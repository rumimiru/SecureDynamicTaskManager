<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Dynamic Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>Secure Dynamic Task Manager</h1>

        <section class="task-controls">
            <label for="taskInput">Add a task</label>
            <div class="input-row">
                <input id="taskInput" type="text" placeholder="Enter a task">
                <button id="addTaskBtn" type="button">Add Task</button>
                <button id="loadSamplesBtn" type="button">Load Sample Tasks</button>
            </div>
            <p id="taskMessage" class="message" aria-live="polite"></p>
        </section>

        <ul id="taskList"></ul>

        <section class="summary" aria-label="Task summary">
            <div>
                <span>Total Tasks</span>
                <strong id="totalCount">0</strong>
            </div>
            <div>
                <span>Pending</span>
                <strong id="pendingCount">0</strong>
            </div>
            <div>
                <span>Completed</span>
                <strong id="completedCount">0</strong>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
